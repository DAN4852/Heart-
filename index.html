<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Running Heart</title>

<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #heart {
    color: pink;
    font-family: monospace;
    white-space: pre;
    font-size: 10px;
    line-height: 10px;
    letter-spacing: 1px;
  }
</style>
</head>

<body>

<div id="heart"></div>

<script>
const text = "แดน💗หมวย ";
let chars = text.split("");

let points = [];

// สร้างจุดหัวใจ
for (let y = 1.5; y > -1.5; y -= 0.08) {
  for (let x = -1.5; x < 1.5; x += 0.04) {

    let formula =
      Math.pow(x*x + y*y - 1, 3) -
      x*x * y*y*y;

    if (formula <= 0) {
      points.push({x, y});
    }
  }
}

// เรียงจุดเป็นวง (เพื่อให้วิ่งวน)
points.sort((a, b) => Math.atan2(a.y, a.x) - Math.atan2(b.y, b.x));

let offset = 0;

function draw() {
  let output = "";
  let i = 0;

  for (let y = 1.5; y > -1.5; y -= 0.08) {
    let line = "";

    for (let x = -1.5; x < 1.5; x += 0.04) {

      let found = false;

      for (let p = 0; p < points.length; p++) {
        if (
          Math.abs(points[p].x - x) < 0.03 &&
          Math.abs(points[p].y - y) < 0.03
        ) {
          let charIndex = (p + offset) % chars.length;
          line += chars[charIndex];
          found = true;
          break;
        }
      }

      if (!found) line += " ";
    }

    output += line + "\n";
  }

  document.getElementById("heart").innerText = output;

  offset++;
}

setInterval(draw, 100);
</script>

</body>
</html>
